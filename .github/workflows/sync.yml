name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - gdpr/main
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (e.g. v1.3.0). Leave empty for latest."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tags
        id: tags
        run: |
          CURRENT=$(cat .github/upstream-version)
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            UPSTREAM="${{ github.event.inputs.tag }}"
          else
            UPSTREAM=$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name')
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "needed=$([ "$CURRENT" != "$UPSTREAM" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Already up to date
        if: steps.tags.outputs.needed == 'false'
        run: echo "Already at ${{ steps.tags.outputs.current }} — nothing to do."

      - name: Create sync branch
        if: steps.tags.outputs.needed == 'true'
        id: branch
        run: |
          TAG="${{ steps.tags.outputs.upstream }}"
          git config user.name "GDPR Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -b "sync/upstream-$TAG"
          echo "name=sync/upstream-$TAG" >> $GITHUB_OUTPUT

      - name: Merge (GDPR-first)
        if: steps.tags.outputs.needed == 'true'
        id: merge
        run: |
          TAG="${{ steps.tags.outputs.upstream }}"
          if git merge "refs/tags/$TAG" -X ours --no-edit --allow-unrelated-histories; then
            echo "conflicts=false" >> $GITHUB_OUTPUT
          else
            git add -A
            git commit -m "sync: merge upstream $TAG (conflicts present)"
            echo "conflicts=true" >> $GITHUB_OUTPUT
          fi

      - name: Push and open PR
        if: steps.tags.outputs.needed == 'true'
        run: |
          TAG="${{ steps.tags.outputs.upstream }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          CONFLICTS="${{ steps.merge.outputs.conflicts }}"
          CURRENT="${{ steps.tags.outputs.current }}"
          git push -u origin "$BRANCH"
          CHANGED=$(git diff --name-only "refs/tags/$CURRENT" "refs/tags/$TAG" 2>/dev/null | head -40 || echo "")
          if [ "$CONFLICTS" = "true" ]; then
            NOTE="Conflicts present — resolve before merging."
          else
            NOTE="Clean merge."
          fi
          gh pr create \
            --base gdpr/main \
            --head "$BRANCH" \
            --title "sync: upstream $TAG" \
            --body "## Upstream sync: $TAG

$NOTE

**Changed files (upstream):**
\`\`\`
$CHANGED
\`\`\`

**GDPR-critical files to review:**
- \`src/gdpr/build-constants.ts\`
- \`src/net/egress-policy.ts\`
- \`src/provider/provider.ts\`
- \`src/audit/gdpr.ts\`
- \`src/audit/network.ts\`

**Validate:** \`git checkout $BRANCH && make validate-gdpr\`

After validation: update \`.github/upstream-version\` to \`$TAG\` and merge."

 
